name: Ruby

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Brakeman
        # --ensure-latest dropped (no proposer exists under security-only; the
        # flag reds lint on brakeman release day) and -w2 filters Weak only.
        run: bundle exec brakeman -A -q --no-pager -w2

      - name: StandardRB
        run: bundle exec standardrb --format simple

  test:
    runs-on: ubuntu-latest

    env:
      BUNDLE_WITHOUT: production
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      DB_PORT_5432_TCP_ADDR: localhost
      DB_ENV_POSTGRESQL_USER: postgres
      DB_ENV_POSTGRESQL_PASS: postgres
      DB_ENV_POSTGRESQL_DB_TEST: postgres
      STORAGE_REDIS_DB_INDEX: 15
      SESSION_REDIS_DB_INDEX: 15
      SESSION_REDIS_HOST: localhost
      SESSION_REDIS_PORT: 6379
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: ${{ env.DB_ENV_POSTGRESQL_PASS }}
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Check out files
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
        env:
          BUNDLE_GEMS__CONTRIBSYS__COM: ${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}

      - name: Set up DB
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: RSpec tests
        run: bundle exec rspec --color

      - name: Codecov upload
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # Known-vulnerability status. NOT a required check, so a backlog never deadlocks
  # merges. Dependabot security-only opens the fixes it can; this is the visible
  # backstop, and groundcru's nightly rubysec sweep reports what Dependabot misses.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Bundle audit
        run: bin/bundler-audit check --update ${{ vars.CVE_IGNORES && format('--ignore {0}', vars.CVE_IGNORES) }}
