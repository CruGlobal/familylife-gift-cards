version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  # Gems are security-only fleet-wide (ratified 2026-08-19; the original
  # ADL-32 intent): individual majors refill the PR ceiling daily and
  # grouped minors rewrite Gemfile pins (infobase#519). Security PRs are
  # exempt from the limit and still open at every semver level. Tool
  # currency (brakeman, bundler-audit) is watched by the nightly digest.
  open-pull-requests-limit: 0
  groups:
    bundler-security:
      applies-to: security-updates
      patterns:
      - "*"
  ignore:
  # NOTE: with limit 0 these are inert forward guards — the version-update
  # lane never runs, and update-types-scoped ignores never gate security
  # updates (dependabot-core IgnoreCondition). Kept so a future limit > 0
  # flip inherits the pin guards.
  # Rails minors/majors are deliberate, hand-run upgrades; security patches
  # within the current minor still flow.
  - dependency-name: rails
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
  # minitest 6 drops minitest/mock (ararat #210 landmine); direct-major
  # guard only — transitive lock-floats stay a review item.
  - dependency-name: minitest
    update-types:
    - version-update:semver-major
  # Gemfile pins connection_pool < 3 (redis_cache_store conflict on
  # Rails < 8.1.2). Drop this ignore with the pin at Rails >= 8.1.2.
  - dependency-name: connection_pool
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    actions-patch:
      patterns:
      - "*"
      update-types:
      - patch
    actions-minor:
      patterns:
      - "*"
      update-types:
      - minor
  ignore:
  # CruGlobal/.github reusable-workflow majors are org-coordinated rollouts
  # (kills the 1->2 pairs like #76/#78).
  - dependency-name: "CruGlobal/.github*"
